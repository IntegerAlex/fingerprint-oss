allowBuilds:
  core-js: false

# Audited overrides. Keep one entry per package: overlapping range keys
# (e.g. "joi@<x" and "joi@>=y <z") resolve by key order and are brittle.
overrides:
  body-parser: ^1.20.9
  brace-expansion: ^1.1.21
  colord: ^2.9.4
  compression: ^1.8.2
  fast-uri: ^3.1.9
  follow-redirects: ^1.16.2
  image-size: ^2.0.3
  joi: ^17.13.9
  js-yaml: ^4.3.2
  launch-editor: ^2.14.2
  postcss-selector-parser: ^7.1.6
  proxy-addr: ^2.0.8
  qs: ^6.16.1
  serialize-javascript: ^7.1.3
  shell-quote: ^1.11.0
  source-map-js: ^1.2.2
  svgo: ^3.3.5
  tinypool: ^2.1.2
  uuid: ^11.1.1
