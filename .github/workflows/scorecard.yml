name: Scorecard

on:
  # Scorecard only evaluates the default branch, and branch-protection changes
  # are what keep the Branch-Protection check current.
  branch_protection_rule:
  push:
    branches: [ main ]
  schedule:
    - cron: '41 3 * * 1'

permissions: read-all

jobs:
  analysis:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    if: github.event.repository.default_branch == github.ref_name
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run Scorecard
        # v2.6.0 moved the action image to ghcr.io. v2.4.0 pulled from
        # gcr.io, which failed with "This API method requires billing to be
        # enabled" and took the whole job down.
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishes the score so the README badge resolves; requires the
          # repository to be public.
          publish_results: true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
          category: scorecard
